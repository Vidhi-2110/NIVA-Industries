<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redSleeve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="yellowSleeve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="blueSleeve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="bbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#bbBg)"/>

  <!-- Blueprint Background Lines -->
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.5">
    <line x1="30" y1="40" x2="470" y2="40"/>
    <line x1="30" y1="340" x2="470" y2="340"/>
    <line x1="50" y1="30" x2="50" y2="350"/>
    <line x1="450" y1="30" x2="450" y2="350"/>
  </g>

  <!-- Precision CNC Fabricated Busbar System (R-Y-B Phases with Namsung Bends) -->
  <g filter="url(#bbShadow)" transform="translate(60, 50)">
    <!-- Insulator Standoffs (DMC / SMC supports) -->
    <rect x="50" y="240" width="280" height="20" rx="3" fill="#334155"/>
    <circle cx="95" cy="235" r="12" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>
    <circle cx="190" cy="235" r="12" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>
    <circle cx="285" cy="235" r="12" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>

    <!-- Phase 1: Red Busbar (Curved and Punched) -->
    <!-- Lower Bar with Sleeving -->
    <path d="M 90,230 L 90,130 L 120,80 L 120,40" fill="none" stroke="url(#redSleeve)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Exposed High-Conductivity Copper Connection Palm with Precision Punched Holes -->
    <rect x="111" y="25" width="18" height="40" rx="2" fill="url(#copperGrad)" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="120" cy="38" r="3.5" fill="#0F172A"/>
    <circle cx="120" cy="54" r="3.5" fill="#0F172A"/>

    <!-- Phase 2: Yellow Busbar (Offset Bend) -->
    <path d="M 185,230 L 185,140 L 210,95 L 210,40" fill="none" stroke="url(#yellowSleeve)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="201" y="25" width="18" height="40" rx="2" fill="url(#copperGrad)" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="210" cy="38" r="3.5" fill="#0F172A"/>
    <circle cx="210" cy="54" r="3.5" fill="#0F172A"/>

    <!-- Phase 3: Blue Busbar (Extended Reach) -->
    <path d="M 280,230 L 280,150 L 300,110 L 300,40" fill="none" stroke="url(#blueSleeve)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="291" y="25" width="18" height="40" rx="2" fill="url(#copperGrad)" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="300" cy="38" r="3.5" fill="#0F172A"/>
    <circle cx="300" cy="54" r="3.5" fill="#0F172A"/>

    <!-- Neutral / Earth Busbar (Tinned Copper Horizontal Bar with bolt array) -->
    <rect x="30" y="270" width="320" height="14" rx="2" fill="url(#copperGrad)" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="60" cy="277" r="3" fill="#0F172A"/>
    <circle cx="100" cy="277" r="3" fill="#0F172A"/>
    <circle cx="140" cy="277" r="3" fill="#0F172A"/>
    <circle cx="180" cy="277" r="3" fill="#0F172A"/>
    <circle cx="220" cy="277" r="3" fill="#0F172A"/>
    <circle cx="260" cy="277" r="3" fill="#0F172A"/>
    <circle cx="300" cy="277" r="3" fill="#0F172A"/>

    <!-- Precision Processing Badge -->
    <rect x="230" y="160" width="130" height="34" rx="4" fill="#0F172A" opacity="0.95"/>
    <text x="295" y="176" font-family="sans-serif" font-size="9" fill="#F8FAFC" font-weight="bold" text-anchor="middle">NAMSUNG CNC</text>
    <text x="295" y="188" font-family="monospace" font-size="8" fill="#FF4D00" text-anchor="middle">CUT · BEND · PUNCH</text>
  </g>
</svg>
