<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="hollowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="boxFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="hollowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#hollowBg)"/>
  
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="40" x2="460" y2="40"/>
    <line x1="40" y1="340" x2="460" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/>
    <line x1="460" y1="40" x2="460" y2="340"/>
  </g>

  <!-- Structural Hollow Sections SHS/RHS -->
  <g filter="url(#hollowShadow)" transform="translate(60, 45)">
    <!-- Box Section 1 (Square) -->
    <!-- Front Face outer -->
    <polygon points="70,90 150,140 150,250 70,200" fill="url(#boxFace)"/>
    <!-- Inside cavity front -->
    <polygon points="85,108 135,140 135,232 85,200" fill="#020617"/>
    <!-- Inside cavity top depth -->
    <polygon points="85,108 135,140 295,70 245,38" fill="#334155"/>
    <polygon points="135,140 135,232 295,162 295,70" fill="#0F172A"/>

    <!-- Top Extrusion Surface -->
    <polygon points="70,90 230,20 310,70 150,140" fill="#F1F5F9"/>
    
    <!-- Right Outer Side Extrusion -->
    <polygon points="150,140 310,70 310,180 150,250" fill="url(#boxSide)"/>

    <!-- Precision radius curves on corner indicators -->
    <path d="M 70 90 Q 75 87, 80 87" stroke="#FF4D00" stroke-width="2" fill="none"/>
    <path d="M 150 140 Q 155 137, 160 137" stroke="#FF4D00" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(290, 290)">
    <rect width="170" height="34" rx="4" fill="#0F172A"/>
    <text x="85" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF4D00" text-anchor="middle">SHS / RHS EN 10210 / 10219</text>
  </g>
</svg>
