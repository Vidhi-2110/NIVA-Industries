<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="facBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="facGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5C00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5C00" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#facBg)"/>

  <!-- Steel Foundry Furnace Glow (Molten Steel Vats) -->
  <circle cx="280" cy="320" r="140" fill="url(#facGlow)"/>

  <!-- Industrial Facility Structural Silhouettes -->
  <!-- Back Bay -->
  <polygon points="40,380 40,160 220,130 220,380" fill="#1E293B"/>
  <polygon points="220,380 220,130 380,110 380,380" fill="#0F172A"/>
  
  <!-- Ventilation Exhaust Chimneys & Stacks -->
  <rect x="100" y="70" width="18" height="90" fill="#475569"/>
  <rect x="130" y="50" width="22" height="110" fill="#334155"/>
  <rect x="290" y="40" width="28" height="70" fill="#475569"/>
  <!-- Clean plume -->
  <path d="M 141 50 Q 150 20, 180 10" stroke="#CBD5E1" stroke-width="4" fill="none" opacity="0.3"/>
  <path d="M 304 40 Q 320 15, 350 5" stroke="#CBD5E1" stroke-width="5" fill="none" opacity="0.3"/>

  <!-- Modern Glass Facade & Admin Wing -->
  <polygon points="400,380 400,180 720,180 720,380" fill="#1E293B"/>
  <!-- Glass windows grid -->
  <g fill="#38BDF8" opacity="0.25">
    <rect x="420" y="200" width="40" height="25" rx="2"/>
    <rect x="480" y="200" width="40" height="25" rx="2"/>
    <rect x="540" y="200" width="40" height="25" rx="2"/>
    <rect x="600" y="200" width="40" height="25" rx="2"/>
    <rect x="660" y="200" width="40" height="25" rx="2"/>

    <rect x="420" y="240" width="40" height="25" rx="2"/>
    <rect x="480" y="240" width="40" height="25" rx="2"/>
    <rect x="540" y="240" width="40" height="25" rx="2"/>
    <rect x="600" y="240" width="40" height="25" rx="2"/>
    <rect x="660" y="240" width="40" height="25" rx="2"/>

    <rect x="420" y="280" width="40" height="25" rx="2"/>
    <rect x="480" y="280" width="40" height="25" rx="2"/>
    <rect x="540" y="280" width="40" height="25" rx="2"/>
    <rect x="600" y="280" width="40" height="25" rx="2"/>
    <rect x="660" y="280" width="40" height="25" rx="2"/>
  </g>

  <!-- Heavy Orange Gantry Crane in foreground -->
  <g stroke="#FF4D00" stroke-width="4">
    <!-- Vertical Legs -->
    <line x1="160" y1="380" x2="200" y2="200"/>
    <line x1="240" y1="380" x2="200" y2="200"/>
    <line x1="680" y1="380" x2="640" y2="200"/>
    <line x1="600" y1="380" x2="640" y2="200"/>
    <!-- Cross Bridge Beam -->
    <line x1="180" y1="200" x2="660" y2="200" stroke-width="8"/>
    <!-- Truss struts -->
    <line x1="220" y1="200" x2="260" y2="225" stroke-width="2"/>
    <line x1="260" y1="225" x2="300" y2="200" stroke-width="2"/>
    <line x1="300" y1="200" x2="340" y2="225" stroke-width="2"/>
    <line x1="340" y1="225" x2="380" y2="200" stroke-width="2"/>
    <!-- Hoist Trolley -->
    <rect x="360" y="190" width="40" height="24" rx="3" fill="#0F172A" stroke="#FF4D00" stroke-width="2"/>
    <line x1="380" y1="214" x2="380" y2="270" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Hook carrying steel beam -->
    <polygon points="360,270 400,270 380,290" fill="#FF4D00"/>
  </g>

  <!-- Ground Tarmac -->
  <rect y="380" width="800" height="70" fill="#0F172A"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#FF4D00" stroke-width="2"/>
</svg>
