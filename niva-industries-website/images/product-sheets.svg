<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="sheetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="galvSpangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="25%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#sheetBg)"/>
  
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="40" x2="460" y2="40"/>
    <line x1="40" y1="340" x2="460" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/>
    <line x1="460" y1="40" x2="460" y2="340"/>
  </g>

  <!-- Corrugated / Galvanized Industrial Steel Plate Stack -->
  <g filter="url(#sheetShadow)" transform="translate(60, 45)">
    <!-- Plate 1 (Bottom Plate) -->
    <polygon points="50,180 280,100 400,160 170,240" fill="#64748B"/>
    
    <!-- Corrugated Sheet (Middle) with wave profile -->
    <path d="M 50 150 Q 75 140, 100 150 T 150 150 T 200 150 L 320 80 Q 295 70, 270 80 T 220 80 T 170 80 Z" fill="#94A3B8" opacity="0.6"/>

    <!-- High-Sheen Top Galvanized Plate with Zinc Spangles -->
    <polygon points="60,130 290,50 410,110 180,190" fill="url(#galvSpangle)"/>
    <polygon points="60,130 180,190 180,198 60,138" fill="#475569"/>
    <polygon points="180,190 410,110 410,118 180,198" fill="#1E293B"/>

    <!-- Galvanized Zinc Spangle Crystal Patterns -->
    <g fill="#FFFFFF" opacity="0.4">
      <polygon points="100,120 115,110 130,125 110,130"/>
      <polygon points="200,90 220,80 235,95 210,105"/>
      <polygon points="150,150 170,140 185,155 160,165"/>
      <polygon points="260,120 280,110 300,125 275,135"/>
      <polygon points="320,95 340,85 355,100 330,110"/>
      <polygon points="220,130 240,120 255,135 230,145"/>
    </g>

    <!-- Dimension indicator lines -->
    <line x1="50" y1="120" x2="170" y2="180" stroke="#FF4D00" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="190" y1="190" x2="420" y2="110" stroke="#FF4D00" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <g transform="translate(290, 290)">
    <rect width="170" height="34" rx="4" fill="#0F172A"/>
    <text x="85" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF4D00" text-anchor="middle">GI / GL COATED • Z275</text>
  </g>
</svg>
