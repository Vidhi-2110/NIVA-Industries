<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B6B"/>
      <stop offset="100%" stop-color="#1A4DB5"/>
    </linearGradient>
    <linearGradient id="boltFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52BBFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Orbit ring -->
  <circle cx="32" cy="32" r="26" stroke="#2196F3" stroke-width="2.5" fill="none"
          stroke-dasharray="118 44" stroke-dashoffset="-8"
          stroke-linecap="round" opacity="0.85"/>
  <circle cx="32" cy="32" r="26" stroke="#2196F3" stroke-width="2.5" fill="none"
          stroke-dasharray="40 122" stroke-dashoffset="-126"
          stroke-linecap="round" opacity="0.4"/>

  <!-- N lettermark (white) -->
  <path d="M12 12 L16 9 L16 52 L12 55 Z" fill="white" opacity="0.95"/>
  <path d="M16 10 L19 8 L19 50 L16 52 Z" fill="white" opacity="0.35"/>
  <path d="M44 12 L48 9 L48 52 L44 55 Z" fill="white" opacity="0.95"/>
  <path d="M48 10 L51 8 L51 50 L48 52 Z" fill="white" opacity="0.35"/>
  <path d="M16 12 L48 52 L44 55 L12 15 Z" fill="white" opacity="0.9"/>

  <!-- Lightning bolt -->
  <g filter="url(#glowFav)" transform="rotate(-8, 32, 32)">
    <path d="M36 7 L28 28 L33 28 L25 57 L43 30 L38 30 Z"
          fill="url(#boltFav)" opacity="0.97"/>
    <path d="M36 7 L31 22 L35 22 L29 44 L41 32 L37 32 Z"
          fill="white" opacity="0.3"/>
  </g>
</svg>
