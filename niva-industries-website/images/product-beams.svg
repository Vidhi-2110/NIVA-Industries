<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="steelGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="steelFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle technical grid -->
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="40" x2="460" y2="40"/>
    <line x1="40" y1="190" x2="460" y2="190"/>
    <line x1="40" y1="340" x2="460" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/>
    <line x1="250" y1="40" x2="250" y2="340"/>
    <line x1="460" y1="40" x2="460" y2="340"/>
  </g>

  <!-- Multiple stacked structural I/H Beams -->
  <g filter="url(#cardShadow)" transform="translate(45, 30)">
    <!-- Rear Beam -->
    <g opacity="0.6" transform="translate(60, -30)">
      <polygon points="120,80 340,30 370,55 150,105" fill="#CBD5E1"/>
      <polygon points="120,80 150,105 150,130 120,105" fill="#94A3B8"/>
      <polygon points="150,105 370,55 350,55 130,105" fill="#64748B"/>
      <polygon points="130,105 140,115 140,210 130,200" fill="#94A3B8"/>
      <polygon points="140,115 360,65 360,160 140,210" fill="#CBD5E1"/>
      <polygon points="120,200 150,225 150,250 120,225" fill="#94A3B8"/>
      <polygon points="150,225 370,175 370,200 150,250" fill="#64748B"/>
    </g>

    <!-- Foreground Massive Primary H-Beam -->
    <polygon points="80,110 320,50 360,80 120,140" fill="url(#steelGlint)"/>
    <polygon points="80,110 120,140 120,170 80,140" fill="url(#steelFace)"/>
    <polygon points="120,140 360,80 340,80 100,140" fill="#334155"/>
    <!-- Web -->
    <polygon points="95,135 105,145 105,255 95,245" fill="url(#steelFace)"/>
    <polygon points="105,145 345,85 345,195 105,255" fill="url(#steelGlint)"/>
    <!-- Web inside shelf -->
    <polygon points="105,255 345,195 360,205 120,265" fill="#F1F5F9" opacity="0.8"/>
    <!-- Bottom Flange -->
    <polygon points="80,245 120,275 120,305 80,275" fill="url(#steelFace)"/>
    <polygon points="120,275 360,215 360,245 120,305" fill="#475569"/>
  </g>

  <!-- Industrial Tag Badge -->
  <g transform="translate(320, 290)">
    <rect width="140" height="34" rx="4" fill="#0F172A"/>
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF4D00" text-anchor="middle">GRADE: S355 / A992</text>
  </g>
</svg>
