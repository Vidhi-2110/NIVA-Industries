<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ltBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="ltShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#ltBg)"/>

  <!-- Blueprint Lines -->
  <g stroke="#94A3B8" stroke-width="0.8" opacity="0.4">
    <line x1="30" y1="40" x2="470" y2="40"/>
    <line x1="30" y1="340" x2="470" y2="340"/>
    <line x1="50" y1="30" x2="50" y2="350"/>
    <line x1="450" y1="30" x2="450" y2="350"/>
  </g>

  <!-- LT Power Distribution Panel Assembly with ACB and Multi-tier MCCBs -->
  <g filter="url(#ltShadow)" transform="translate(100, 45)">
    <!-- Base Frame -->
    <rect x="20" y="20" width="260" height="255" rx="4" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="20" y="275" width="260" height="15" rx="2" fill="#0F172A"/>

    <!-- Incomer Section with ACB (Left Column) -->
    <rect x="28" y="28" width="115" height="238" rx="2" fill="url(#doorGrad)" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Multifunction Meter Display -->
    <rect x="38" y="38" width="95" height="40" rx="3" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="85" y="55" font-family="monospace" font-size="10" fill="#38BDF8" text-anchor="middle" font-weight="bold">415.2 V</text>
    <text x="85" y="70" font-family="monospace" font-size="9" fill="#22C55E" text-anchor="middle">1250 A</text>
    <!-- Phase Indicator Lights R-Y-B -->
    <circle cx="48" cy="92" r="4.5" fill="#EF4444"/>
    <circle cx="68" cy="92" r="4.5" fill="#EAB308"/>
    <circle cx="88" cy="92" r="4.5" fill="#3B82F6"/>
    <!-- ACB Breaker Draw-Out Compartment -->
    <rect x="36" y="110" width="99" height="95" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="44" y="120" width="83" height="30" rx="2" fill="#0F172A"/>
    <text x="85" y="139" font-family="monospace" font-size="9" fill="#F8FAFC" text-anchor="middle" font-weight="bold">ACB 2000A</text>
    <rect x="52" y="160" width="25" height="20" rx="2" fill="#22C55E"/>
    <rect x="93" y="160" width="25" height="20" rx="2" fill="#EF4444"/>
    <!-- Padlock Lever -->
    <circle cx="85" cy="180" r="5" fill="#F59E0B"/>

    <!-- Outgoing Feeder Section with Multi-way MCCBs (Right Column) -->
    <rect x="151" y="28" width="121" height="238" rx="2" fill="url(#doorGrad)" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- 4 Tiers of MCCBs -->
    <!-- Tier 1 -->
    <rect x="159" y="38" width="105" height="42" rx="2" fill="#1E293B"/>
    <text x="180" y="55" font-family="monospace" font-size="8" fill="#94A3B8">MCCB 1</text>
    <rect x="220" y="47" width="35" height="15" rx="2" fill="#0F172A"/>
    <circle cx="230" cy="54" r="3" fill="#22C55E"/>
    <text x="245" y="58" font-family="monospace" font-size="7" fill="#4ADE80">ON</text>

    <!-- Tier 2 -->
    <rect x="159" y="88" width="105" height="42" rx="2" fill="#1E293B"/>
    <text x="180" y="105" font-family="monospace" font-size="8" fill="#94A3B8">MCCB 2</text>
    <rect x="220" y="97" width="35" height="15" rx="2" fill="#0F172A"/>
    <circle cx="230" cy="104" r="3" fill="#22C55E"/>
    <text x="245" y="108" font-family="monospace" font-size="7" fill="#4ADE80">ON</text>

    <!-- Tier 3 -->
    <rect x="159" y="138" width="105" height="42" rx="2" fill="#1E293B"/>
    <text x="180" y="155" font-family="monospace" font-size="8" fill="#94A3B8">MCCB 3</text>
    <rect x="220" y="147" width="35" height="15" rx="2" fill="#0F172A"/>
    <circle cx="230" cy="154" r="3" fill="#22C55E"/>
    <text x="245" y="158" font-family="monospace" font-size="7" fill="#4ADE80">ON</text>

    <!-- Tier 4 -->
    <rect x="159" y="188" width="105" height="42" rx="2" fill="#1E293B"/>
    <text x="180" y="205" font-family="monospace" font-size="8" fill="#94A3B8">MCCB 4</text>
    <rect x="220" y="197" width="35" height="15" rx="2" fill="#0F172A"/>
    <circle cx="230" cy="204" r="3" fill="#EF4444"/>
    <text x="245" y="208" font-family="monospace" font-size="7" fill="#EF4444">OFF</text>

    <!-- Door interlock handles -->
    <rect x="144" y="130" width="5" height="25" rx="2" fill="#64748B"/>
    <rect x="268" y="130" width="5" height="25" rx="2" fill="#64748B"/>
  </g>
</svg>
