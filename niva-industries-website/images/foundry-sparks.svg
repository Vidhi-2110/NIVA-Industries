<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="foundryDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="50%" stop-color="#0F0E0D"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="torchGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="30%" stop-color="#FF5C00"/>
      <stop offset="70%" stop-color="#FF3300" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF3300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="350" fill="url(#foundryDark)"/>

  <!-- Steel Workpiece & Anvil -->
  <polygon points="120,350 480,350 420,240 180,240" fill="#332D28"/>
  <polygon points="180,240 420,240 380,210 220,210" fill="#4D433D"/>

  <!-- Foundry Worker Silhouette -->
  <g fill="#0F0E0D">
    <!-- Body -->
    <path d="M 230 350 C 240 220, 260 180, 280 180 C 300 180, 320 220, 330 350 Z"/>
    <!-- Head with Visor -->
    <ellipse cx="280" cy="140" rx="24" ry="28"/>
    <!-- Welding Mask Window Glow -->
    <rect x="270" y="132" width="22" height="10" rx="2" fill="#FF5C00"/>
    <!-- Arm holding torch -->
    <path d="M 270 200 L 290 230 L 320 220" stroke="#0F0E0D" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Molten Steel Glow & Shower of Sparks -->
  <circle cx="310" cy="225" r="90" fill="url(#torchGlow)"/>

  <!-- Flying Dynamic Sparks -->
  <g stroke="#FDE047" stroke-width="2" stroke-linecap="round">
    <line x1="310" y1="225" x2="240" y2="160"/>
    <line x1="310" y1="225" x2="220" y2="210"/>
    <line x1="310" y1="225" x2="250" y2="280"/>
    <line x1="310" y1="225" x2="380" y2="150"/>
    <line x1="310" y1="225" x2="410" y2="190"/>
    <line x1="310" y1="225" x2="430" y2="240"/>
    <line x1="310" y1="225" x2="390" y2="290"/>
    <line x1="310" y1="225" x2="330" y2="130"/>
    <line x1="310" y1="225" x2="280" y2="140"/>
    <line x1="310" y1="225" x2="350" y2="300"/>
  </g>
  <g stroke="#FF7A33" stroke-width="1.5" stroke-linecap="round">
    <line x1="310" y1="225" x2="200" y2="180"/>
    <line x1="310" y1="225" x2="190" y2="240"/>
    <line x1="310" y1="225" x2="440" y2="160"/>
    <line x1="310" y1="225" x2="460" y2="220"/>
  </g>
</svg>
