<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="dryEnclosureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="coilsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="dryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#dryBg)"/>

  <!-- Blueprint Background Grid -->
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="30" y1="40" x2="470" y2="40"/>
    <line x1="30" y1="340" x2="470" y2="340"/>
    <line x1="50" y1="30" x2="50" y2="350"/>
    <line x1="450" y1="30" x2="450" y2="350"/>
  </g>

  <!-- Dry Type Transformer Enclosure Diagram -->
  <g filter="url(#dryShadow)" transform="translate(85, 45)">
    <!-- Base Channel Frame -->
    <rect x="20" y="270" width="290" height="18" rx="2" fill="#1E293B"/>
    <circle cx="45" cy="279" r="4" fill="#64748B"/>
    <circle cx="305" cy="279" r="4" fill="#64748B"/>

    <!-- Outer Protective Enclosure (IP 23 / IP 33) -->
    <rect x="25" y="25" width="280" height="245" rx="6" fill="#F1F5F9" stroke="#0284C7" stroke-width="2.5"/>
    <!-- Canopy Top with Overhang for Rain Protection -->
    <path d="M 15 25 L 315 25 L 305 12 L 25 12 Z" fill="#0369A1"/>

    <!-- Lifting Lugs -->
    <rect x="45" y="4" width="20" height="10" rx="3" fill="#0284C7"/>
    <circle cx="55" cy="9" r="3" fill="#FFFFFF"/>
    <rect x="265" y="4" width="20" height="10" rx="3" fill="#0284C7"/>
    <circle cx="275" cy="9" r="3" fill="#FFFFFF"/>

    <!-- Cutaway View: 3-Phase Cast Resin Coils -->
    <rect x="42" y="75" width="246" height="175" rx="4" fill="#0F172A" opacity="0.95"/>
    <text x="165" y="60" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">CAST RESIN DRY TYPE TRANSFORMER</text>

    <!-- Phase U (Red) -->
    <rect x="58" y="90" width="55" height="125" rx="10" fill="url(#coilsGrad)" stroke="#FCA5A5" stroke-width="1.5"/>
    <rect x="73" y="105" width="25" height="95" rx="4" fill="#7F1D1D"/>
    <text x="85" y="160" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">R</text>

    <!-- Phase V (Yellow) -->
    <rect x="138" y="90" width="55" height="125" rx="10" fill="#EAB308" stroke="#FEF08A" stroke-width="1.5"/>
    <rect x="153" y="105" width="25" height="95" rx="4" fill="#854D0E"/>
    <text x="165" y="160" font-family="monospace" font-size="12" fill="#0F172A" text-anchor="middle" font-weight="bold">Y</text>

    <!-- Phase W (Blue) -->
    <rect x="218" y="90" width="55" height="125" rx="10" fill="#2563EB" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="233" y="105" width="25" height="95" rx="4" fill="#1E3A8A"/>
    <text x="245" y="160" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">B</text>

    <!-- Core Clamping Channels Top & Bottom -->
    <rect x="48" y="80" width="234" height="14" rx="2" fill="#475569"/>
    <rect x="48" y="210" width="234" height="14" rx="2" fill="#475569"/>

    <!-- Heavy-Duty Ventilation Louvers on Side Panels -->
    <g fill="#94A3B8">
      <rect x="33" y="100" width="6" height="3" rx="1"/>
      <rect x="33" y="110" width="6" height="3" rx="1"/>
      <rect x="33" y="120" width="6" height="3" rx="1"/>
      <rect x="33" y="130" width="6" height="3" rx="1"/>
      <rect x="33" y="140" width="6" height="3" rx="1"/>
      <rect x="33" y="150" width="6" height="3" rx="1"/>

      <rect x="291" y="100" width="6" height="3" rx="1"/>
      <rect x="291" y="110" width="6" height="3" rx="1"/>
      <rect x="291" y="120" width="6" height="3" rx="1"/>
      <rect x="291" y="130" width="6" height="3" rx="1"/>
      <rect x="291" y="140" width="6" height="3" rx="1"/>
      <rect x="291" y="150" width="6" height="3" rx="1"/>
    </g>

    <!-- Warning / Spec Plate -->
    <rect x="120" y="235" width="90" height="20" rx="2" fill="#E2E8F0" stroke="#94A3B8"/>
    <text x="165" y="249" font-family="monospace" font-size="8" fill="#0F172A" text-anchor="middle" font-weight="bold">IP 23 / IP 33 ENCLOSURE</text>

    <!-- Earthing Terminal Indicator -->
    <circle cx="285" cy="255" r="5" fill="#22C55E"/>
    <path d="M 285 252 L 285 258 M 283 255 L 287 255" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>
