<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="robotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="robotArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A33"/>
      <stop offset="50%" stop-color="#FF4D00"/>
      <stop offset="100%" stop-color="#C23600"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#FF5C00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5C00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark high-tech factory background -->
  <rect width="800" height="450" fill="url(#robotBg)"/>

  <!-- Factory Assembly Conveyor Line -->
  <polygon points="0,420 800,420 800,320 0,320" fill="#0F172A"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#334155" stroke-width="3"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#1E293B" stroke-width="2" stroke-dasharray="20 10"/>

  <!-- Steel Workpiece on Assembly line -->
  <polygon points="260,330 540,330 500,280 220,280" fill="#64748B"/>
  <polygon points="500,280 540,330 540,350 500,300" fill="#334155"/>
  <polygon points="220,280 500,280 500,300 220,300" fill="#94A3B8"/>

  <!-- Robotic Arm 1 (Left Orange Articulated Arm) -->
  <g transform="translate(180, 290)">
    <!-- Base Pedestal -->
    <rect x="-40" y="0" width="80" height="40" fill="#334155" rx="4"/>
    <circle cx="0" cy="0" r="30" fill="#0F172A" stroke="#FF4D00" stroke-width="3"/>
    
    <!-- Lower Arm Segment -->
    <g transform="rotate(-40)">
      <rect x="-18" y="-140" width="36" height="140" rx="8" fill="url(#robotArm)"/>
      <circle cx="0" cy="-140" r="22" fill="#0F172A" stroke="#CBD5E1" stroke-width="3"/>
      
      <!-- Upper Forearm Segment -->
      <g transform="translate(0, -140) rotate(85)">
        <rect x="-14" y="-120" width="28" height="120" rx="6" fill="url(#robotArm)"/>
        <!-- Wrist & Welding Torch -->
        <g transform="translate(0, -120) rotate(-45)">
          <rect x="-10" y="-30" width="20" height="30" fill="#334155"/>
          <line x1="0" y1="-30" x2="30" y2="-60" stroke="#E2E8F0" stroke-width="6"/>
          <!-- Welding Tip -->
          <circle cx="32" cy="-62" r="4" fill="#FF4D00"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Robotic Arm 2 (Right Orange Articulated Arm) -->
  <g transform="translate(620, 290)">
    <!-- Base Pedestal -->
    <rect x="-40" y="0" width="80" height="40" fill="#334155" rx="4"/>
    <circle cx="0" cy="0" r="30" fill="#0F172A" stroke="#FF4D00" stroke-width="3"/>
    
    <!-- Lower Arm Segment -->
    <g transform="rotate(35)">
      <rect x="-18" y="-140" width="36" height="140" rx="8" fill="url(#robotArm)"/>
      <circle cx="0" cy="-140" r="22" fill="#0F172A" stroke="#CBD5E1" stroke-width="3"/>
      
      <!-- Upper Forearm Segment -->
      <g transform="translate(0, -140) rotate(-80)">
        <rect x="-14" y="-120" width="28" height="120" rx="6" fill="url(#robotArm)"/>
        <!-- Wrist -->
        <g transform="translate(0, -120) rotate(45)">
          <rect x="-10" y="-30" width="20" height="30" fill="#334155"/>
          <line x1="0" y1="-30" x2="-25" y2="-55" stroke="#E2E8F0" stroke-width="6"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Welding Plasma / Laser Sparks -->
  <circle cx="410" cy="285" r="70" fill="url(#sparkGlow)"/>
  <!-- Flying sparks -->
  <g stroke="#FDE047" stroke-width="2" stroke-linecap="round">
    <line x1="410" y1="285" x2="380" y2="245"/>
    <line x1="410" y1="285" x2="435" y2="235"/>
    <line x1="410" y1="285" x2="455" y2="265"/>
    <line x1="410" y1="285" x2="365" y2="280"/>
    <line x1="410" y1="285" x2="390" y2="310"/>
    <line x1="410" y1="285" x2="440" y2="305"/>
  </g>

  <!-- Tech Status Overlay -->
  <g transform="translate(30, 30)">
    <rect width="260" height="60" rx="6" fill="#0F172A" opacity="0.9" stroke="#334155"/>
    <circle cx="25" cy="30" r="6" fill="#10B981"/>
    <text x="42" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">AUTOMATED CELL #04</text>
    <text x="42" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">TOLERANCE ±0.05MM • ACTIVE</text>
  </g>
</svg>
