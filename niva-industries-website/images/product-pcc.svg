<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pccMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="pccShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#pccBg)"/>

  <!-- Blueprint Background Grid -->
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="30" y1="40" x2="470" y2="40"/>
    <line x1="30" y1="340" x2="470" y2="340"/>
    <line x1="50" y1="30" x2="50" y2="350"/>
    <line x1="450" y1="30" x2="450" y2="350"/>
  </g>

  <!-- PCC Multi-Column Switchboard -->
  <g filter="url(#pccShadow)" transform="translate(60, 45)">
    <!-- Base Channel -->
    <rect x="10" y="270" width="360" height="18" rx="2" fill="#0F172A"/>

    <!-- Bay 1: Main Incomer ACB (Left) -->
    <rect x="15" y="20" width="115" height="250" rx="4" fill="url(#pccMetal)" stroke="#64748B" stroke-width="1.5"/>
    <rect x="25" y="30" width="95" height="35" rx="3" fill="#0F172A"/>
    <text x="72" y="47" font-family="monospace" font-size="9" fill="#38BDF8" text-anchor="middle" font-weight="bold">INCOMER 1</text>
    <text x="72" y="58" font-family="monospace" font-size="8" fill="#4ADE80" text-anchor="middle">415V · 3200A</text>
    <!-- Phase Indicators -->
    <circle cx="38" cy="78" r="4" fill="#EF4444"/>
    <circle cx="53" cy="78" r="4" fill="#EAB308"/>
    <circle cx="68" cy="78" r="4" fill="#3B82F6"/>
    <!-- ACB Compartment -->
    <rect x="25" y="95" width="95" height="95" rx="3" fill="#1E293B" stroke="#475569"/>
    <rect x="35" y="105" width="75" height="28" rx="2" fill="#0F172A"/>
    <text x="72" y="123" font-family="monospace" font-size="9" fill="#F8FAFC" text-anchor="middle" font-weight="bold">ACB DRAW-OUT</text>
    <rect x="42" y="145" width="25" height="18" rx="2" fill="#22C55E"/>
    <rect x="78" y="145" width="25" height="18" rx="2" fill="#EF4444"/>
    <text x="54" y="157" font-family="sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle">I</text>
    <text x="90" y="157" font-family="sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle">O</text>
    <!-- Cable Alley Bottom -->
    <rect x="25" y="200" width="95" height="60" rx="2" fill="#E2E8F0" stroke="#94A3B8"/>
    <text x="72" y="235" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">CABLE ALLEY</text>

    <!-- Bay 2: Bus Coupler (Middle) -->
    <rect x="135" y="20" width="110" height="250" rx="4" fill="url(#pccMetal)" stroke="#64748B" stroke-width="1.5"/>
    <rect x="145" y="30" width="90" height="35" rx="3" fill="#0F172A"/>
    <text x="190" y="47" font-family="monospace" font-size="9" fill="#F59E0B" text-anchor="middle" font-weight="bold">BUS COUPLER</text>
    <text x="190" y="58" font-family="monospace" font-size="8" fill="#CBD5E1" text-anchor="middle">3200A TIE</text>
    <circle cx="158" cy="78" r="4" fill="#EF4444"/>
    <circle cx="173" cy="78" r="4" fill="#EAB308"/>
    <circle cx="188" cy="78" r="4" fill="#3B82F6"/>
    <rect x="145" y="95" width="90" height="95" rx="3" fill="#1E293B" stroke="#475569"/>
    <rect x="155" y="105" width="70" height="28" rx="2" fill="#0F172A"/>
    <text x="190" y="123" font-family="monospace" font-size="9" fill="#F8FAFC" text-anchor="middle" font-weight="bold">COUPLER ACB</text>
    <rect x="160" y="145" width="22" height="18" rx="2" fill="#22C55E"/>
    <rect x="195" y="145" width="22" height="18" rx="2" fill="#EF4444"/>
    <rect x="145" y="200" width="90" height="60" rx="2" fill="#E2E8F0" stroke="#94A3B8"/>
    <text x="190" y="235" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">BUS CHAMBER</text>

    <!-- Bay 3: Outgoing Feeders Multi-tier (Right) -->
    <rect x="250" y="20" width="115" height="250" rx="4" fill="url(#pccMetal)" stroke="#64748B" stroke-width="1.5"/>
    <!-- Feeder 1 -->
    <rect x="258" y="30" width="100" height="52" rx="2" fill="#1E293B" stroke="#475569"/>
    <text x="270" y="47" font-family="monospace" font-size="8" fill="#38BDF8">MCCB 630A</text>
    <circle cx="340" cy="45" r="3" fill="#22C55E"/>
    <rect x="270" y="58" width="75" height="15" rx="2" fill="#0F172A"/>
    <!-- Feeder 2 -->
    <rect x="258" y="90" width="100" height="52" rx="2" fill="#1E293B" stroke="#475569"/>
    <text x="270" y="107" font-family="monospace" font-size="8" fill="#38BDF8">MCCB 400A</text>
    <circle cx="340" cy="105" r="3" fill="#22C55E"/>
    <rect x="270" y="118" width="75" height="15" rx="2" fill="#0F172A"/>
    <!-- Feeder 3 -->
    <rect x="258" y="150" width="100" height="52" rx="2" fill="#1E293B" stroke="#475569"/>
    <text x="270" y="167" font-family="monospace" font-size="8" fill="#38BDF8">MCCB 250A</text>
    <circle cx="340" cy="165" r="3" fill="#22C55E"/>
    <rect x="270" y="178" width="75" height="15" rx="2" fill="#0F172A"/>
    <!-- Feeder 4 -->
    <rect x="258" y="210" width="100" height="52" rx="2" fill="#1E293B" stroke="#475569"/>
    <text x="270" y="227" font-family="monospace" font-size="8" fill="#38BDF8">MCCB 160A</text>
    <circle cx="340" cy="225" r="3" fill="#22C55E"/>
    <rect x="270" y="238" width="75" height="15" rx="2" fill="#0F172A"/>
  </g>
</svg>
