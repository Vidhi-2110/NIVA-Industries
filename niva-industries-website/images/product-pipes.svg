<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pipeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="pipeEnd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <filter id="pipeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#pipeBg)"/>
  
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="40" x2="460" y2="40"/>
    <line x1="40" y1="340" x2="460" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/>
    <line x1="460" y1="40" x2="460" y2="340"/>
  </g>

  <!-- Stacked Seamless Industrial Pipes -->
  <g filter="url(#pipeShadow)" transform="translate(50, 40)">
    <!-- Pipe 1 (Back Left) -->
    <g transform="translate(40, 20)">
      <path d="M 60 70 L 320 20 L 320 100 L 60 150 Z" fill="url(#pipeBody)" opacity="0.7"/>
      <ellipse cx="60" cy="110" rx="25" ry="40" fill="url(#pipeEnd)"/>
      <ellipse cx="60" cy="110" rx="17" ry="28" fill="#020617"/>
    </g>

    <!-- Pipe 2 (Back Right) -->
    <g transform="translate(100, 50)">
      <path d="M 60 70 L 320 20 L 320 100 L 60 150 Z" fill="url(#pipeBody)" opacity="0.8"/>
      <ellipse cx="60" cy="110" rx="25" ry="40" fill="url(#pipeEnd)"/>
      <ellipse cx="60" cy="110" rx="17" ry="28" fill="#020617"/>
    </g>

    <!-- Pipe 3 (Front Lower Main Large Pipe) -->
    <g transform="translate(20, 80)">
      <path d="M 80 50 L 360 -5 L 360 105 L 80 160 Z" fill="url(#pipeBody)"/>
      <ellipse cx="80" cy="105" rx="35" ry="55" fill="url(#pipeEnd)"/>
      <ellipse cx="80" cy="105" rx="25" ry="40" fill="#020617"/>
      
      <!-- Spec Stencil on Pipe Body -->
      <g transform="rotate(-9 200 65)">
        <text x="140" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#CBD5E1" opacity="0.7" letter-spacing="2">NIVA SEAMLESS ASTM A106 GRADE B SCH 80</text>
      </g>
    </g>
  </g>

  <g transform="translate(270, 290)">
    <rect width="190" height="34" rx="4" fill="#0F172A"/>
    <text x="95" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF4D00" text-anchor="middle">API 5L / ASTM A106 SCH 40/80</text>
  </g>
</svg>
