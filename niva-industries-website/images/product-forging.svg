<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="forgingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="flangeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="flangeSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="forgingShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#forgingBg)"/>
  
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="40" x2="460" y2="40"/>
    <line x1="40" y1="340" x2="460" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/>
    <line x1="460" y1="40" x2="460" y2="340"/>
  </g>

  <!-- Heavy Forged Flange / High-Tolerance Component -->
  <g filter="url(#forgingShadow)" transform="translate(100, 45)">
    <!-- Base Disc Cylinder Thickness -->
    <path d="M 50 140 L 50 180 C 50 240, 250 240, 250 180 L 250 140 Z" fill="url(#flangeSide)"/>

    <!-- Base Disc Top Face (Isometric Ellipse) -->
    <ellipse cx="150" cy="140" rx="100" ry="45" fill="url(#flangeFace)" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Bolt Holes Around Flange Perimeter -->
    <g fill="#0F172A" stroke="#94A3B8" stroke-width="1">
      <ellipse cx="80" cy="135" rx="7" ry="3.5"/>
      <ellipse cx="105" cy="165" rx="7" ry="3.5"/>
      <ellipse cx="150" cy="175" rx="7" ry="3.5"/>
      <ellipse cx="195" cy="165" rx="7" ry="3.5"/>
      <ellipse cx="220" cy="135" rx="7" ry="3.5"/>
      <ellipse cx="195" cy="115" rx="7" ry="3.5"/>
      <ellipse cx="150" cy="105" rx="7" ry="3.5"/>
      <ellipse cx="105" cy="115" rx="7" ry="3.5"/>
    </g>

    <!-- Raised Neck / Hub Cylinder -->
    <path d="M 100 80 L 100 135 C 100 160, 200 160, 200 135 L 200 80 Z" fill="url(#flangeSide)"/>
    <!-- Raised Neck Top Face -->
    <ellipse cx="150" cy="80" rx="50" ry="22" fill="url(#flangeFace)" stroke="#F8FAFC" stroke-width="1.5"/>

    <!-- Inner Bore / Through Hole -->
    <ellipse cx="150" cy="80" rx="30" ry="13" fill="#020617"/>
    <path d="M 120 80 L 120 120 C 120 135, 180 135, 180 120 L 180 80 Z" fill="#0F172A" opacity="0.6"/>

    <!-- Precision Chamfer Highlight -->
    <ellipse cx="150" cy="80" rx="46" ry="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
  </g>

  <g transform="translate(280, 290)">
    <rect width="180" height="34" rx="4" fill="#0F172A"/>
    <text x="90" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF4D00" text-anchor="middle">ASME B16.5 CLASS 150-2500</text>
  </g>
</svg>
