<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" fill="none">
  <defs>
    <linearGradient id="nGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BDD9FF"/>
    </linearGradient>
    <linearGradient id="boltGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52BBFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="orbitGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52BBFF"/>
      <stop offset="60%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#2196F3" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(2, 4)">
    <circle cx="32" cy="32" r="28" stroke="url(#orbitGradLight)" stroke-width="3.5" fill="none"
            stroke-dasharray="130 46" stroke-dashoffset="-10"
            stroke-linecap="round"/>
    <circle cx="32" cy="32" r="28" stroke="url(#orbitGradLight)" stroke-width="3.5" fill="none"
            stroke-dasharray="44 132" stroke-dashoffset="-136"
            stroke-linecap="round" opacity="0.55"/>

    <!-- N lettermark (white for dark backgrounds) -->
    <path d="M12 11 L16 8 L16 55 L12 58 Z" fill="url(#nGradLight)"/>
    <path d="M16 9 L20 6 L20 53 L16 56 Z" fill="white" opacity="0.4"/>
    <path d="M42 11 L46 8 L46 55 L42 58 Z" fill="url(#nGradLight)"/>
    <path d="M46 9 L50 6 L50 53 L46 56 Z" fill="white" opacity="0.4"/>
    <path d="M16 11 L46 52 L42 55 L12 14 Z" fill="url(#nGradLight)"/>

    <!-- Lightning bolt -->
    <g filter="url(#glowLight)" transform="rotate(-8, 32, 32)">
      <path d="M36 6 L27 30 L33 30 L24 58 L44 28 L37 28 Z"
            fill="url(#boltGradLight)" opacity="0.95"/>
      <path d="M36 6 L31 24 L36 24 L28 46 L41 30 L36 30 Z"
            fill="white" opacity="0.35"/>
    </g>
    <polygon points="28,58 24,62 32,60" fill="#52BBFF" opacity="0.9"/>
  </g>

  <!-- NIVA wordmark — white on dark -->
  <text x="78" y="38"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="900" font-size="32" letter-spacing="2"
        fill="#FFFFFF">NIVA</text>

  <!-- Triangle accent on A -->
  <polygon points="190,40 195,32 200,40" fill="#52BBFF" opacity="0.9"/>

  <!-- Subtitle -->
  <text x="78" y="54"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="600" font-size="9.5" letter-spacing="2.2"
        fill="#BDD9FF">POWER INDUSTRIES PVT. LTD.</text>

  <!-- Tagline -->
  <rect x="78" y="63" width="16" height="2" rx="1" fill="#52BBFF"/>
  <text x="98" y="66"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="600" font-size="7" letter-spacing="1.8"
        fill="#52BBFF">POWERING PROGRESS.</text>
  <text x="194" y="66"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="600" font-size="7" letter-spacing="1.8"
        fill="#BDD9FF"> ENERGIZING TOMORROW.</text>
  <rect x="275" y="63" width="16" height="2" rx="1" fill="#52BBFF"/>
</svg>
