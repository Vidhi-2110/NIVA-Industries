<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="rebarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="rebarRod1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="30%" stop-color="#64748B"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="rebarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#rebarBg)"/>
  
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="40" x2="460" y2="40"/>
    <line x1="40" y1="340" x2="460" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/>
    <line x1="460" y1="40" x2="460" y2="340"/>
  </g>

  <!-- Rebar Bundle Representation -->
  <g filter="url(#rebarShadow)" transform="translate(60, 40)">
    <!-- Primary Rod 1 -->
    <g transform="rotate(-25 200 150)">
      <!-- Main cylinder -->
      <rect x="20" y="90" width="360" height="32" rx="16" fill="url(#rebarRod1)"/>
      <!-- End face -->
      <ellipse cx="20" cy="106" rx="10" ry="16" fill="#94A3B8"/>
      <ellipse cx="20" cy="106" rx="6" ry="10" fill="#475569"/>
      <!-- Ribs (Deformations) -->
      <g stroke="#E2E8F0" stroke-width="3" opacity="0.8">
        <line x1="50" y1="90" x2="70" y2="122"/>
        <line x1="80" y1="90" x2="100" y2="122"/>
        <line x1="110" y1="90" x2="130" y2="122"/>
        <line x1="140" y1="90" x2="160" y2="122"/>
        <line x1="170" y1="90" x2="190" y2="122"/>
        <line x1="200" y1="90" x2="220" y2="122"/>
        <line x1="230" y1="90" x2="250" y2="122"/>
        <line x1="260" y1="90" x2="280" y2="122"/>
        <line x1="290" y1="90" x2="310" y2="122"/>
        <line x1="320" y1="90" x2="340" y2="122"/>
        <line x1="350" y1="90" x2="370" y2="122"/>
      </g>
    </g>

    <!-- Secondary Rod 2 -->
    <g transform="rotate(-25 200 150) translate(0, 45)">
      <rect x="40" y="90" width="340" height="32" rx="16" fill="url(#rebarRod1)"/>
      <ellipse cx="40" cy="106" rx="10" ry="16" fill="#94A3B8"/>
      <g stroke="#E2E8F0" stroke-width="3" opacity="0.8">
        <line x1="70" y1="90" x2="90" y2="122"/>
        <line x1="100" y1="90" x2="120" y2="122"/>
        <line x1="130" y1="90" x2="150" y2="122"/>
        <line x1="160" y1="90" x2="180" y2="122"/>
        <line x1="190" y1="90" x2="210" y2="122"/>
        <line x1="220" y1="90" x2="240" y2="122"/>
        <line x1="250" y1="90" x2="270" y2="122"/>
        <line x1="280" y1="90" x2="300" y2="122"/>
        <line x1="310" y1="90" x2="330" y2="122"/>
        <line x1="340" y1="90" x2="360" y2="122"/>
      </g>
    </g>

    <!-- Third Rod 3 -->
    <g transform="rotate(-25 200 150) translate(20, -45)">
      <rect x="30" y="90" width="350" height="32" rx="16" fill="url(#rebarRod1)"/>
      <ellipse cx="30" cy="106" rx="10" ry="16" fill="#94A3B8"/>
      <g stroke="#E2E8F0" stroke-width="3" opacity="0.8">
        <line x1="60" y1="90" x2="80" y2="122"/>
        <line x1="90" y1="90" x2="110" y2="122"/>
        <line x1="120" y1="90" x2="140" y2="122"/>
        <line x1="150" y1="90" x2="170" y2="122"/>
        <line x1="180" y1="90" x2="200" y2="122"/>
        <line x1="210" y1="90" x2="230" y2="122"/>
        <line x1="240" y1="90" x2="260" y2="122"/>
        <line x1="270" y1="90" x2="290" y2="122"/>
        <line x1="300" y1="90" x2="320" y2="122"/>
        <line x1="330" y1="90" x2="350" y2="122"/>
      </g>
    </g>

    <!-- Industrial Tie Wire / Band (Orange) -->
    <g transform="rotate(-25 200 150)">
      <rect x="180" y="30" width="16" height="150" rx="3" fill="#FF4D00" opacity="0.9"/>
    </g>
  </g>

  <g transform="translate(290, 290)">
    <rect width="170" height="34" rx="4" fill="#0F172A"/>
    <text x="85" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF4D00" text-anchor="middle">FE 500D / 550D TMT</text>
  </g>
</svg>
