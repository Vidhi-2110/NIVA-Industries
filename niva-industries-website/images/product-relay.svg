<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="relayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="relayDoor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="relayShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#relayBg)"/>

  <!-- Blueprint Lines -->
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="30" y1="40" x2="470" y2="40"/>
    <line x1="30" y1="340" x2="470" y2="340"/>
    <line x1="50" y1="30" x2="50" y2="350"/>
    <line x1="450" y1="30" x2="450" y2="350"/>
  </g>

  <!-- Protection Relay Panel Front Fascia -->
  <g filter="url(#relayShadow)" transform="translate(115, 45)">
    <!-- Base Plinth -->
    <rect x="15" y="270" width="240" height="18" rx="2" fill="#0F172A"/>

    <!-- Cabinet -->
    <rect x="20" y="20" width="230" height="250" rx="4" fill="url(#relayDoor)" stroke="#475569" stroke-width="2"/>

    <!-- Top Alarm Annunciator Fascia (8 Window Grid) -->
    <rect x="35" y="30" width="200" height="36" rx="2" fill="#0F172A" stroke="#334155"/>
    <g fill="#FEF08A" stroke="#854D0E" stroke-width="0.8">
      <rect x="40" y="34" width="22" height="12" rx="1"/>
      <rect x="64" y="34" width="22" height="12" rx="1"/>
      <rect x="88" y="34" width="22" height="12" rx="1"/>
      <rect x="112" y="34" width="22" height="12" rx="1"/>
      <rect x="136" y="34" width="22" height="12" rx="1"/>
      <rect x="160" y="34" width="22" height="12" rx="1"/>
      <rect x="184" y="34" width="22" height="12" rx="1"/>
      <rect x="208" y="34" width="22" height="12" rx="1"/>

      <rect x="40" y="49" width="22" height="12" rx="1"/>
      <rect x="64" y="49" width="22" height="12" rx="1"/>
      <rect x="88" y="49" width="22" height="12" rx="1"/>
      <rect x="112" y="49" width="22" height="12" rx="1"/>
      <rect x="136" y="49" width="22" height="12" rx="1"/>
      <rect x="160" y="49" width="22" height="12" rx="1"/>
      <rect x="184" y="49" width="22" height="12" rx="1"/>
      <rect x="208" y="49" width="22" height="12" rx="1"/>
    </g>

    <!-- Main Numerical Protection Relay (Feeder / Transformer Protection) -->
    <rect x="35" y="74" width="200" height="85" rx="3" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Relay LCD Screen -->
    <rect x="45" y="82" width="105" height="42" rx="2" fill="#0F172A" stroke="#38BDF8"/>
    <text x="97" y="98" font-family="monospace" font-size="8" fill="#38BDF8" text-anchor="middle" font-weight="bold">FEEDER RELAY 50/51</text>
    <text x="97" y="112" font-family="monospace" font-size="7" fill="#4ADE80" text-anchor="middle">STATUS: ARMED / HEALTHY</text>
    <circle cx="52" cy="118" r="2" fill="#22C55E"/>
    <!-- Relay Navigation Keypad -->
    <rect x="160" y="82" width="65" height="42" rx="2" fill="#0F172A"/>
    <circle cx="180" cy="95" r="4" fill="#64748B"/>
    <circle cx="193" cy="95" r="4" fill="#64748B"/>
    <circle cx="206" cy="95" r="4" fill="#64748B"/>
    <circle cx="180" cy="112" r="4" fill="#64748B"/>
    <circle cx="193" cy="112" r="4" fill="#22C55E"/>
    <circle cx="206" cy="112" r="4" fill="#EF4444"/>
    <!-- Optical USB / Modbus Port -->
    <circle cx="50" cy="144" r="5" fill="#334155" stroke="#94A3B8"/>
    <text x="140" y="147" font-family="sans-serif" font-size="8" fill="#94A3B8">IEC 61850 PROTOCOL READY</text>

    <!-- Test Blocks (Current / Voltage CT/PT Injection) -->
    <rect x="35" y="168" width="95" height="45" rx="2" fill="#1E293B" stroke="#64748B"/>
    <text x="82" y="180" font-family="monospace" font-size="7" fill="#CBD5E1" text-anchor="middle">CT / PT TEST BLOCK</text>
    <g fill="#EF4444">
      <circle cx="48" cy="195" r="3"/>
      <circle cx="62" cy="195" r="3"/>
      <circle cx="76" cy="195" r="3"/>
      <circle cx="90" cy="195" r="3"/>
      <circle cx="104" cy="195" r="3"/>
      <circle cx="118" cy="195" r="3"/>
    </g>

    <!-- Master Trip Relay (Lockout Relay 86) -->
    <rect x="140" y="168" width="95" height="45" rx="2" fill="#1E293B" stroke="#DC2626"/>
    <text x="187" y="180" font-family="monospace" font-size="7" fill="#FCA5A5" text-anchor="middle">LOCKOUT RELAY 86</text>
    <circle cx="187" cy="196" r="10" fill="#0F172A" stroke="#EF4444" stroke-width="2"/>
    <rect x="185" y="188" width="4" height="16" fill="#EF4444"/>

    <!-- Control Switches & Indicating Lamps (Bottom Section) -->
    <rect x="35" y="222" width="200" height="40" rx="2" fill="#1E293B" stroke="#64748B"/>
    <!-- Breaker Control Switch (TNC - Trip / Neutral / Close) -->
    <circle cx="65" cy="242" r="11" fill="#0F172A" stroke="#94A3B8"/>
    <text x="65" y="245" font-family="monospace" font-size="7" fill="#FFFFFF" text-anchor="middle">TNC</text>
    <!-- Trip Circuit Supervision (TCS) -->
    <circle cx="110" cy="242" r="5" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="110" y="233" font-family="monospace" font-size="6" fill="#94A3B8" text-anchor="middle">TCS 1</text>
    <circle cx="130" cy="242" r="5" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="130" y="233" font-family="monospace" font-size="6" fill="#94A3B8" text-anchor="middle">TCS 2</text>
    <!-- Breaker Status: Red (Closed) Green (Open) Amber (Tripped) -->
    <circle cx="165" cy="242" r="6" fill="#EF4444"/>
    <circle cx="185" cy="242" r="6" fill="#22C55E"/>
    <circle cx="205" cy="242" r="6" fill="#F59E0B"/>
  </g>
</svg>
