<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vfdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="vfdDoor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="vfdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#vfdBg)"/>

  <!-- Blueprint Lines -->
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="30" y1="40" x2="470" y2="40"/>
    <line x1="30" y1="340" x2="470" y2="340"/>
    <line x1="50" y1="30" x2="50" y2="350"/>
    <line x1="450" y1="30" x2="450" y2="350"/>
  </g>

  <!-- VFD Drive Panel (Cutaway Internal View) -->
  <g filter="url(#vfdShadow)" transform="translate(100, 45)">
    <!-- Base Channel -->
    <rect x="15" y="270" width="270" height="18" rx="2" fill="#0F172A"/>

    <!-- Enclosure Cabinet -->
    <rect x="20" y="20" width="260" height="250" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2"/>

    <!-- Left Open Door -->
    <path d="M 20 20 L -25 35 L -25 255 L 20 270 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" opacity="0.9"/>
    <!-- Digital Potentiometer & Display on Door -->
    <polygon points="-18,70 2,62 2,130 -18,138" fill="#1E293B" stroke="#0284C7"/>
    <circle cx="-8" cy="115" r="5" fill="#EF4444"/>

    <!-- Top Incomer Line Choke & Semiconductor Fuses -->
    <rect x="35" y="32" width="105" height="40" rx="2" fill="#1E293B" stroke="#64748B"/>
    <text x="87" y="47" font-family="monospace" font-size="8" fill="#38BDF8" text-anchor="middle">AC LINE CHOKE</text>
    <rect x="45" y="55" width="85" height="10" rx="2" fill="#D97706"/>
    <!-- Fast Acting Fuses -->
    <rect x="150" y="32" width="115" height="40" rx="2" fill="#1E293B" stroke="#64748B"/>
    <text x="207" y="47" font-family="monospace" font-size="8" fill="#4ADE80" text-anchor="middle">SEMICONDUCTOR FUSES</text>
    <circle cx="175" cy="60" r="3" fill="#22C55E"/>
    <circle cx="205" cy="60" r="3" fill="#22C55E"/>
    <circle cx="235" cy="60" r="3" fill="#22C55E"/>

    <!-- Core VFD Drive Unit with Keypad & Aluminum Cooling Fins -->
    <rect x="40" y="85" width="220" height="125" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Cooling Heatsink Fins (Top) -->
    <g fill="#334155">
      <rect x="50" y="92" width="8" height="20" rx="1"/>
      <rect x="62" y="92" width="8" height="20" rx="1"/>
      <rect x="74" y="92" width="8" height="20" rx="1"/>
      <rect x="86" y="92" width="8" height="20" rx="1"/>
      <rect x="98" y="92" width="8" height="20" rx="1"/>
      <rect x="110" y="92" width="8" height="20" rx="1"/>
    </g>

    <!-- VFD Keypad & Seven Segment / LCD Display -->
    <rect x="135" y="92" width="115" height="48" rx="3" fill="#0F172A" stroke="#38BDF8"/>
    <rect x="142" y="97" width="65" height="20" rx="2" fill="#064E3B"/>
    <text x="174" y="111" font-family="monospace" font-size="10" fill="#34D399" text-anchor="middle" font-weight="bold">50.00 Hz</text>
    <!-- Speed RPM / Status -->
    <text x="174" y="132" font-family="monospace" font-size="7" fill="#6EE7B7" text-anchor="middle">1480 RPM · RUN</text>
    <circle cx="220" cy="105" r="4" fill="#22C55E"/>
    <circle cx="235" cy="105" r="4" fill="#EF4444"/>
    <circle cx="227" cy="125" r="5" fill="#3B82F6"/>

    <!-- Internal Inverter Circuit & DC Bus Capacitors -->
    <rect x="50" y="150" width="200" height="48" rx="2" fill="#0F172A"/>
    <text x="150" y="165" font-family="monospace" font-size="8" fill="#F59E0B" text-anchor="middle">IGBT INVERTER STAGE</text>
    <circle cx="80" cy="182" r="8" fill="#38BDF8"/>
    <circle cx="105" cy="182" r="8" fill="#38BDF8"/>
    <circle cx="130" cy="182" r="8" fill="#38BDF8"/>
    <circle cx="155" cy="182" r="8" fill="#38BDF8"/>
    <rect x="180" y="174" width="60" height="16" rx="2" fill="#DC2626"/>
    <text x="210" y="185" font-family="monospace" font-size="7" fill="#FFFFFF" text-anchor="middle">BRAKING UNIT</text>

    <!-- Bottom Output Reactor & Heavy Cable Terminals -->
    <rect x="35" y="220" width="230" height="40" rx="2" fill="#1E293B" stroke="#64748B"/>
    <text x="150" y="233" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="middle">OUTPUT dv/dt FILTER · MOTOR CABLES</text>
    <!-- High Current Terminals U V W -->
    <circle cx="90" cy="248" r="6" fill="#EF4444"/>
    <circle cx="120" cy="248" r="6" fill="#EAB308"/>
    <circle cx="150" cy="248" r="6" fill="#3B82F6"/>
    <circle cx="180" cy="248" r="6" fill="#22C55E"/>
    <text x="90" y="251" font-family="monospace" font-size="7" fill="#FFFFFF" text-anchor="middle">U</text>
    <text x="120" y="251" font-family="monospace" font-size="7" fill="#0F172A" text-anchor="middle">V</text>
    <text x="150" y="251" font-family="monospace" font-size="7" fill="#FFFFFF" text-anchor="middle">W</text>
    <text x="180" y="251" font-family="monospace" font-size="7" fill="#FFFFFF" text-anchor="middle">E</text>
  </g>
</svg>
