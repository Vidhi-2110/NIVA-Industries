<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" fill="none">
  <defs>
    <!-- Deep Navy to Electric Blue gradient for the N lettermark -->
    <linearGradient id="nGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B6B"/>
      <stop offset="100%" stop-color="#1A4DB5"/>
    </linearGradient>
    <!-- Electric Blue for lightning bolt & orbit ring -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#00B4FF"/>
    </linearGradient>
    <!-- Orbit ring gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="60%" stop-color="#0D6EFD"/>
      <stop offset="100%" stop-color="#0A3399" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Icon: Circular orbit + N lettermark + lightning bolt ── -->
  <g transform="translate(2, 4)">
    <!-- Orbit ring (open arc — gap at top-right like in the uploaded logo) -->
    <!-- Full circle stroke, then masked gap -->
    <circle cx="32" cy="32" r="28" stroke="url(#orbitGrad)" stroke-width="3.5" fill="none"
            stroke-dasharray="130 46" stroke-dashoffset="-10"
            stroke-linecap="round"/>

    <!-- Second arc sweeping the other direction (bottom sweep) -->
    <circle cx="32" cy="32" r="28" stroke="url(#orbitGrad)" stroke-width="3.5" fill="none"
            stroke-dasharray="44 132" stroke-dashoffset="-136"
            stroke-linecap="round" opacity="0.55"/>

    <!-- N lettermark body (bold, 3-D look with shadow face) -->
    <!-- Left pillar shadow face -->
    <path d="M16 9 L20 6 L20 53 L16 56 Z" fill="#0B2060" opacity="0.9"/>
    <!-- Left pillar front face -->
    <path d="M12 11 L16 8 L16 55 L12 58 Z" fill="url(#nGradDark)"/>
    <!-- Right pillar shadow face -->
    <path d="M46 9 L50 6 L50 53 L46 56 Z" fill="#0B2060" opacity="0.9"/>
    <!-- Right pillar front face -->
    <path d="M42 11 L46 8 L46 55 L42 58 Z" fill="url(#nGradDark)"/>
    <!-- Diagonal cross stroke left→right -->
    <path d="M16 11 L46 52 L42 55 L12 14 Z" fill="url(#nGradDark)"/>

    <!-- Lightning bolt overlaid diagonally (electric blue) -->
    <g filter="url(#glow)" transform="rotate(-8, 32, 32)">
      <!-- Bolt top segment -->
      <path d="M36 6 L27 30 L33 30 L24 58 L44 28 L37 28 Z"
            fill="url(#boltGrad)" opacity="0.95"/>
      <!-- Bolt highlight -->
      <path d="M36 6 L31 24 L36 24 L28 46 L41 30 L36 30 Z"
            fill="white" opacity="0.25"/>
    </g>

    <!-- Small arrowhead at bottom of bolt -->
    <polygon points="28,58 24,62 32,60" fill="#2196F3" opacity="0.8"/>
  </g>

  <!-- ── Wordmark: NIVA ── -->
  <text x="78" y="38"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="900" font-size="32" letter-spacing="2"
        fill="url(#nGradDark)">NIVA</text>

  <!-- Inline triangle accent on the "A" — a small blue triangle below the A apex -->
  <polygon points="190,40 195,32 200,40" fill="#2196F3" opacity="0.9"/>

  <!-- ── Wordmark: POWER INDUSTRIES PVT. LTD. ── -->
  <text x="78" y="54"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="600" font-size="9.5" letter-spacing="2.2"
        fill="#1C3A7A">POWER INDUSTRIES PVT. LTD.</text>

  <!-- ── Tagline with side dashes ── -->
  <!-- Left dash -->
  <rect x="78" y="63" width="16" height="2" rx="1" fill="#2196F3"/>
  <text x="98" y="66"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="600" font-size="7" letter-spacing="1.8"
        fill="#2196F3">POWERING PROGRESS.</text>
  <text x="194" y="66"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="600" font-size="7" letter-spacing="1.8"
        fill="#1A4DB5"> ENERGIZING TOMORROW.</text>
  <!-- Right dash -->
  <rect x="275" y="63" width="16" height="2" rx="1" fill="#2196F3"/>
</svg>
