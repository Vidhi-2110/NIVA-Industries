<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="beamFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="beamShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="beamTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5C00" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient background glow behind beam -->
  <circle cx="320" cy="240" r="180" fill="url(#orangeGlow)"/>

  <!-- 3D Isometric H-Beam / Wide-Flange Section -->
  <g filter="url(#shadow3D)">
    <!-- Main Extruded Body (Sides & Recesses) -->
    <!-- Top Flange Extrusion -->
    <polygon points="180,120 440,70 480,110 220,160" fill="url(#beamTop)"/>
    
    <!-- Top Flange Front Face -->
    <polygon points="180,120 220,160 220,195 180,155" fill="url(#beamFace)"/>
    
    <!-- Top Flange Underside Right -->
    <polygon points="220,195 480,145 440,145 200,195" fill="url(#beamShade)" opacity="0.8"/>

    <!-- Central Web Front Face -->
    <polygon points="195,190 205,200 205,320 195,310" fill="url(#beamFace)"/>

    <!-- Central Web Right Extrusion (Main vertical web inside channel) -->
    <polygon points="205,200 465,150 465,270 205,320" fill="url(#beamFace)"/>
    
    <!-- Bottom Flange Top Surface Right -->
    <polygon points="205,320 465,270 480,285 220,335" fill="url(#beamTop)" opacity="0.9"/>

    <!-- Bottom Flange Front Face -->
    <polygon points="180,315 220,355 220,390 180,350" fill="url(#beamFace)"/>

    <!-- Bottom Flange Right Side Extrusion -->
    <polygon points="220,355 480,305 480,340 220,390" fill="url(#beamShade)"/>
    
    <!-- Top Flange Outer Right Face -->
    <polygon points="440,70 480,110 480,145 440,105" fill="url(#beamShade)"/>
  </g>

  <!-- Engineering Blueprint Dimension Callouts -->
  <g stroke="#FF4D00" stroke-width="1.5">
    <!-- Height Indicator -->
    <line x1="150" y1="120" x2="150" y2="350"/>
    <line x1="140" y1="120" x2="160" y2="120"/>
    <line x1="140" y1="350" x2="160" y2="350"/>

    <!-- Length Indicator -->
    <line x1="225" y1="410" x2="485" y2="360"/>
    <line x1="220" y1="400" x2="230" y2="420"/>
    <line x1="480" y1="350" x2="490" y2="370"/>
  </g>

  <!-- Spec Labels with Badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <rect x="70" y="220" width="70" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="238" fill="#FF4D00" font-weight="700">h: 400mm</text>

    <rect x="330" y="405" width="85" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="340" y="423" fill="#38BDF8" font-weight="700">L: 12,000mm</text>
  </g>
</svg>
