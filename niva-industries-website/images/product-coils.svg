<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="coilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="coilFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="90%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="coilCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="coilShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="12" fill="url(#coilBg)"/>
  
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="40" x2="460" y2="40"/>
    <line x1="40" y1="340" x2="460" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/>
    <line x1="460" y1="40" x2="460" y2="340"/>
  </g>

  <!-- 3D Steel Coil Representation -->
  <g filter="url(#coilShadow)" transform="translate(60, 45)">
    <!-- Main Cylinder Body Extrusion -->
    <path d="M 160 50 L 320 120 L 320 250 L 160 180 Z" fill="url(#coilCylinder)"/>

    <!-- Cylinder Longitudinal Sheen Lines -->
    <line x1="160" y1="65" x2="320" y2="135" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="160" y1="90" x2="320" y2="160" stroke="#CBD5E1" stroke-width="3" opacity="0.4"/>
    <line x1="160" y1="140" x2="320" y2="210" stroke="#0F172A" stroke-width="4" opacity="0.3"/>

    <!-- Safety Strapping Band (Orange) -->
    <path d="M 230 80 L 250 89 L 250 219 L 230 210 Z" fill="#FF4D00"/>
    <rect x="235" y="130" width="10" height="15" fill="#FFFFFF" rx="2"/>

    <!-- Front Circular Winding Face (Isometric Ellipse) -->
    <!-- Outer Rim -->
    <ellipse cx="160" cy="115" rx="75" ry="65" fill="#475569" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Concentric winding layers -->
    <ellipse cx="160" cy="115" rx="68" ry="59" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="160" cy="115" rx="60" ry="52" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <ellipse cx="160" cy="115" rx="52" ry="45" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <ellipse cx="160" cy="115" rx="44" ry="38" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <!-- Center Core Eye (Hollow Shaft) -->
    <ellipse cx="160" cy="115" rx="35" ry="30" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
    <!-- Deep Core Inner Shadow -->
    <ellipse cx="162" cy="117" rx="26" ry="22" fill="#020617"/>

    <!-- Secondary Behind Coil -->
    <g transform="translate(140, 20)" opacity="0.7">
      <ellipse cx="140" cy="115" rx="55" ry="48" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
      <ellipse cx="140" cy="115" rx="25" ry="22" fill="#0F172A"/>
    </g>
  </g>

  <g transform="translate(290, 290)">
    <rect width="170" height="34" rx="4" fill="#0F172A"/>
    <text x="85" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF4D00" text-anchor="middle">HR / CR COILS • 0.5-25MM</text>
  </g>
</svg>
