<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="canalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="50%" stop-color="#4D7C0F"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="500" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <path d="M 80 120 Q 120 90, 160 120 Q 200 110, 240 130 Q 160 150, 80 120 Z" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 680 80 Q 720 50, 770 80 Q 820 70, 860 90 Q 770 110, 680 80 Z" fill="#FFFFFF" opacity="0.6"/>

  <!-- Horizon Fields -->
  <path d="M 0 280 L 1000 240 L 1000 500 L 0 500 Z" fill="url(#fieldGrad)"/>

  <!-- Clean Energy Wind Turbines -->
  <!-- Turbine 1 (Far left) -->
  <g transform="translate(140, 140)">
    <line x1="0" y1="120" x2="0" y2="0" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#E2E8F0"/>
    <line x1="0" y1="0" x2="-40" y2="-60" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="0" y1="0" x2="45" y2="-55" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="70" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Turbine 2 (Middle) -->
  <g transform="translate(280, 160)">
    <line x1="0" y1="100" x2="0" y2="0" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="4" fill="#E2E8F0"/>
    <line x1="0" y1="0" x2="-35" y2="-50" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="40" y2="-45" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>

  <!-- Turbine 3 (Far right) -->
  <g transform="translate(420, 180)">
    <line x1="0" y1="80" x2="0" y2="0" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="3.5" fill="#E2E8F0"/>
    <line x1="0" y1="0" x2="-28" y2="-40" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="0" x2="30" y2="-38" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="48" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Solar Farm Bank on Left Bank -->
  <g fill="url(#solarGrad)" stroke="#38BDF8" stroke-width="0.8">
    <polygon points="40,320 180,300 240,340 100,365"/>
    <polygon points="50,370 190,345 250,385 110,415"/>
    <polygon points="60,420 200,390 260,430 120,465"/>
  </g>

  <!-- Water Canal Flowing into Foreground -->
  <path d="M 520 250 L 580 250 L 980 500 L 400 500 Z" fill="url(#canalGrad)"/>
  <path d="M 540 250 L 550 250 L 580 500 L 530 500 Z" fill="#38BDF8" opacity="0.3"/>

  <!-- High-Tech Orange Steel Suspension Bridge across canal -->
  <g stroke="#FF4D00" stroke-width="3">
    <!-- Pylons -->
    <line x1="500" y1="360" x2="500" y2="240"/>
    <line x1="720" y1="450" x2="720" y2="280"/>
    <!-- Suspension cables -->
    <path d="M 440 370 Q 500 240, 610 350" fill="none" stroke="#FF4D00" stroke-width="2"/>
    <path d="M 610 350 Q 720 280, 850 430" fill="none" stroke="#FF4D00" stroke-width="2"/>
    <!-- Road deck -->
    <line x1="420" y1="375" x2="880" y2="445" stroke="#0F172A" stroke-width="6"/>
  </g>

  <!-- ESG Badge Overlay -->
  <g transform="translate(680, 40)">
    <rect width="280" height="70" rx="8" fill="#0F172A" opacity="0.9"/>
    <circle cx="35" cy="35" r="18" fill="#10B981"/>
    <path d="M 28 35 L 33 40 L 43 28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="65" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">CIRCULAR STEEL &amp; ESG</text>
    <text x="65" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">-82% CO2 // 100% RECYCLED SCRAP</text>
  </g>
</svg>
