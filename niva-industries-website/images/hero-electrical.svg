<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Crisp Sky Gradient -->
    <linearGradient id="elecSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Industrial Safety Orange Transformer Colors -->
    <linearGradient id="orangeUnit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B26"/>
      <stop offset="40%" stop-color="#FF4D00"/>
      <stop offset="100%" stop-color="#C23600"/>
    </linearGradient>
    <linearGradient id="orangeUnit2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A0D"/>
      <stop offset="100%" stop-color="#B83200"/>
    </linearGradient>
    <linearGradient id="steelMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="porcelainBushing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="substationShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1320" height="620" fill="url(#elecSky)"/>

  <!-- Subtle Blueprint Cad Coordinates Grid -->
  <g stroke="#CBD5E1" stroke-width="0.75" opacity="0.45" stroke-dasharray="6 6">
    <line x1="220" y1="0" x2="220" y2="620"/>
    <line x1="660" y1="0" x2="660" y2="620"/>
    <line x1="1100" y1="0" x2="1100" y2="620"/>
    <line x1="0" y1="360" x2="1320" y2="360"/>
  </g>

  <!-- Distant Background Transmission Towers (Pylons) -->
  <g stroke="#94A3B8" stroke-width="1.8" opacity="0.55">
    <!-- Pylon 1 (Right background) -->
    <line x1="1040" y1="520" x2="1080" y2="180"/>
    <line x1="1120" y1="520" x2="1080" y2="180"/>
    <line x1="1055" y1="410" x2="1105" y2="410"/>
    <line x1="1065" y1="310" x2="1095" y2="310"/>
    <line x1="1055" y1="410" x2="1095" y2="310"/>
    <line x1="1105" y1="410" x2="1065" y2="310"/>
    <line x1="1030" y1="230" x2="1130" y2="230" stroke-width="3"/>
    <line x1="1040" y1="280" x2="1120" y2="280" stroke-width="2.5"/>

    <!-- Pylon 2 (Left background) -->
    <line x1="180" y1="520" x2="220" y2="220"/>
    <line x1="260" y1="520" x2="220" y2="220"/>
    <line x1="195" y1="420" x2="245" y2="420"/>
    <line x1="205" y1="330" x2="235" y2="330"/>
    <line x1="170" y1="260" x2="270" y2="260" stroke-width="3"/>
  </g>

  <!-- High-Voltage Busbar & Catenary Powerlines -->
  <g stroke="#64748B" stroke-width="1.8" opacity="0.4" fill="none">
    <path d="M 0 180 Q 550 250, 1080 180"/>
    <path d="M 0 220 Q 550 290, 1080 230"/>
    <path d="M 0 260 Q 550 330, 1080 280"/>
    <path d="M 220 220 Q 700 280, 1320 210"/>
  </g>

  <!-- Concrete Plinth / Substation Base Platform -->
  <polygon points="60,540 1260,540 1200,620 120,620" fill="#E2E8F0" opacity="0.8"/>
  <line x1="60" y1="540" x2="1260" y2="540" stroke="#CBD5E1" stroke-width="3"/>

  <!-- High-Power Industrial Transformer & Substation Infrastructure -->
  <g filter="url(#substationShadow)">
    <!-- Central Large High-Voltage Step-Up Transformer Tank (Safety Orange) -->
    <g transform="translate(360, 240)">
      <!-- Main Transformer Core Body -->
      <rect x="60" y="80" width="380" height="220" rx="8" fill="url(#orangeUnit1)"/>
      
      <!-- Top Conservator Oil Tank Cylinder -->
      <rect x="110" y="35" width="280" height="36" rx="18" fill="url(#steelMetallic)"/>
      <ellipse cx="110" cy="53" rx="12" ry="18" fill="#475569"/>
      <ellipse cx="390" cy="53" rx="12" ry="18" fill="#94A3B8"/>
      <!-- Pipe connect -->
      <rect x="235" y="71" width="30" height="12" fill="#334155"/>

      <!-- Radiator / Cooling Fin Array on Left -->
      <g fill="#B83200" opacity="0.85">
        <rect x="80" y="110" width="12" height="160" rx="2"/>
        <rect x="105" y="110" width="12" height="160" rx="2"/>
        <rect x="130" y="110" width="12" height="160" rx="2"/>
        <rect x="155" y="110" width="12" height="160" rx="2"/>
        <rect x="180" y="110" width="12" height="160" rx="2"/>
        <rect x="205" y="110" width="12" height="160" rx="2"/>
      </g>

      <!-- Control Cabinet on Right with Inspection Door -->
      <rect x="260" y="110" width="150" height="160" rx="4" fill="#0F172A" opacity="0.9"/>
      <rect x="275" y="125" width="120" height="130" rx="3" fill="#1E293B"/>
      <!-- Status Indicator Lights -->
      <circle cx="295" cy="145" r="4" fill="#10B981"/>
      <circle cx="315" cy="145" r="4" fill="#38BDF8"/>
      <circle cx="335" cy="145" r="4" fill="#FF4D00"/>
      <!-- Control Display Screen -->
      <rect x="290" y="165" width="90" height="45" rx="3" fill="#0A0D14"/>
      <line x1="295" y1="180" x2="375" y2="180" stroke="#38BDF8" stroke-width="2"/>
      <line x1="295" y1="192" x2="350" y2="192" stroke="#10B981" stroke-width="2"/>

      <!-- High-Voltage Porcelain Insulator Bushings (Top Terminals) -->
      <!-- Bushing Phase A -->
      <g transform="translate(100, -50)">
        <polygon points="35,0 45,0 55,90 25,90" fill="url(#porcelainBushing)"/>
        <!-- Bushing Sheds (Rims) -->
        <ellipse cx="40" cy="20" rx="18" ry="5" fill="#475569"/>
        <ellipse cx="40" cy="35" rx="20" ry="5.5" fill="#334155"/>
        <ellipse cx="40" cy="50" rx="22" ry="6" fill="#475569"/>
        <ellipse cx="40" cy="65" rx="24" ry="6.5" fill="#334155"/>
        <ellipse cx="40" cy="80" rx="26" ry="7" fill="#475569"/>
        <!-- Terminal Stud & Corona Ring -->
        <line x1="40" y1="0" x2="40" y2="-20" stroke="#E2E8F0" stroke-width="4"/>
        <ellipse cx="40" cy="-5" rx="14" ry="4" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
      </g>

      <!-- Bushing Phase B -->
      <g transform="translate(210, -50)">
        <polygon points="35,0 45,0 55,90 25,90" fill="url(#porcelainBushing)"/>
        <ellipse cx="40" cy="20" rx="18" ry="5" fill="#475569"/>
        <ellipse cx="40" cy="35" rx="20" ry="5.5" fill="#334155"/>
        <ellipse cx="40" cy="50" rx="22" ry="6" fill="#475569"/>
        <ellipse cx="40" cy="65" rx="24" ry="6.5" fill="#334155"/>
        <ellipse cx="40" cy="80" rx="26" ry="7" fill="#475569"/>
        <line x1="40" y1="0" x2="40" y2="-20" stroke="#E2E8F0" stroke-width="4"/>
        <ellipse cx="40" cy="-5" rx="14" ry="4" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
      </g>

      <!-- Bushing Phase C -->
      <g transform="translate(320, -50)">
        <polygon points="35,0 45,0 55,90 25,90" fill="url(#porcelainBushing)"/>
        <ellipse cx="40" cy="20" rx="18" ry="5" fill="#475569"/>
        <ellipse cx="40" cy="35" rx="20" ry="5.5" fill="#334155"/>
        <ellipse cx="40" cy="50" rx="22" ry="6" fill="#475569"/>
        <ellipse cx="40" cy="65" rx="24" ry="6.5" fill="#334155"/>
        <ellipse cx="40" cy="80" rx="26" ry="7" fill="#475569"/>
        <line x1="40" y1="0" x2="40" y2="-20" stroke="#E2E8F0" stroke-width="4"/>
        <ellipse cx="40" cy="-5" rx="14" ry="4" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Adjacent Switchgear & Circuit Breaker Unit (Right Side) -->
    <g transform="translate(860, 310)">
      <rect x="0" y="50" width="180" height="180" rx="6" fill="#1E293B"/>
      <rect x="15" y="65" width="150" height="150" rx="4" fill="#0F172A"/>
      <!-- Steel Breaker Columns -->
      <g transform="translate(30, -50)">
        <rect x="0" y="10" width="20" height="90" rx="2" fill="url(#porcelainBushing)"/>
        <ellipse cx="10" cy="25" rx="14" ry="4" fill="#475569"/>
        <ellipse cx="10" cy="45" rx="14" ry="4" fill="#475569"/>
        <ellipse cx="10" cy="65" rx="14" ry="4" fill="#475569"/>
        <line x1="10" y1="10" x2="10" y2="-15" stroke="#E2E8F0" stroke-width="3"/>
      </g>
      <g transform="translate(80, -50)">
        <rect x="0" y="10" width="20" height="90" rx="2" fill="url(#porcelainBushing)"/>
        <ellipse cx="10" cy="25" rx="14" ry="4" fill="#475569"/>
        <ellipse cx="10" cy="45" rx="14" ry="4" fill="#475569"/>
        <ellipse cx="10" cy="65" rx="14" ry="4" fill="#475569"/>
        <line x1="10" y1="10" x2="10" y2="-15" stroke="#E2E8F0" stroke-width="3"/>
      </g>
      <g transform="translate(130, -50)">
        <rect x="0" y="10" width="20" height="90" rx="2" fill="url(#porcelainBushing)"/>
        <ellipse cx="10" cy="25" rx="14" ry="4" fill="#475569"/>
        <ellipse cx="10" cy="45" rx="14" ry="4" fill="#475569"/>
        <ellipse cx="10" cy="65" rx="14" ry="4" fill="#475569"/>
        <line x1="10" y1="10" x2="10" y2="-15" stroke="#E2E8F0" stroke-width="3"/>
      </g>
    </g>

    <!-- Switchgear Secondary Unit (Left Side) -->
    <g transform="translate(160, 340)">
      <rect x="0" y="50" width="160" height="150" rx="6" fill="#1E293B"/>
      <rect x="15" y="65" width="130" height="120" rx="4" fill="#0F172A"/>
      <!-- Safety Orange Conduit Riser -->
      <rect x="60" y="-30" width="35" height="80" rx="4" fill="url(#orangeUnit2)"/>
      <ellipse cx="77.5" cy="-30" rx="17.5" ry="6" fill="#FF7A33"/>
    </g>
  </g>
</svg>
